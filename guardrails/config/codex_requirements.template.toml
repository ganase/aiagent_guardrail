# Codex enterprise requirements template
# This file contains organization-managed settings used by the standard installer.

[windows]
allowed_sandbox_implementations = ["elevated"]

[features]
hooks = true

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%AIAGENT_GUARDRAIL_HOME%\\hooks\\record_ai_turn.ps1" -Tool Codex'

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%AIAGENT_GUARDRAIL_HOME%\\hooks\\record_ai_turn.ps1" -Tool Codex'
[[hooks.PermissionRequest]]
matcher = "^Bash$"

[[hooks.PermissionRequest.hooks]]
type = "command"
command_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%AIAGENT_GUARDRAIL_HOME%\\hooks\\approve_safe_request.ps1" -Tool Codex'
[[hooks.PermissionRequest]]
matcher = "Read|Glob|Grep"

[[hooks.PermissionRequest.hooks]]
type = "command"
command_windows = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%AIAGENT_GUARDRAIL_HOME%\\hooks\\approve_safe_request.ps1" -Tool Codex'
